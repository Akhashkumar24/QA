name: CI — AWS TestKit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_live:
        description: "Run preflight + end-to-end against real AWS"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  # -----------------------------------------------------------------------
  # Offline gate — no AWS credentials. Runs on every push/PR.
  # -----------------------------------------------------------------------
  checks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,db]"

      - name: Lint
        run: ruff check src tests

      - name: checks.py self-test
        run: python -c "from aws_testkit.checks import demo; demo()"

      - name: Validate every use-case config
        run: aws-testkit validate

      - name: Config tests
        run: pytest tests/test_config.py -q

      - name: Generic step resolution (collect-only, no AWS)
        run: pytest tests/features/steps/test_generic.py --collect-only -q

  # -----------------------------------------------------------------------
  # Live — manual dispatch only, needs AWS SSO / OIDC credentials.
  # -----------------------------------------------------------------------
  live:
    if: github.event_name == 'workflow_dispatch' && inputs.run_live
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,db]"

      # Provide credentials via OIDC (aws-actions/configure-aws-credentials) or
      # AWS_* secrets. Map profile names in conf/profiles.yaml or via *_AWS_PROFILE.
      - name: Configure AWS credentials
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
          AWS_DEFAULT_REGION: ca-central-1
        run: aws sts get-caller-identity

      - name: Preflight
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
          AWS_DEFAULT_REGION: ca-central-1
        run: pytest -m preflight -q

      - name: End-to-end suite
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
          AWS_DEFAULT_REGION: ca-central-1
        run: |
          pytest tests/features/steps/test_generic.py \
            --html=reports/ci.html --self-contained-html

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-report
          path: reports/Test_Report_*.html
          retention-days: 30
