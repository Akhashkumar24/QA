name: CI — AWS TestKit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_real_aws:
        description: "Run S3 validation against real AWS"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  # -----------------------------------------------------------------------
  # 1. Unit tests (moto — no Docker required)
  # -----------------------------------------------------------------------
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run unit tests
        run: |
          pytest -m unit --alluredir=allure-results-unit -v

      - name: Upload unit Allure results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-results-unit-py${{ matrix.python-version }}
          path: allure-results-unit/
          retention-days: 14

  # -----------------------------------------------------------------------
  # 2. Integration tests (LocalStack via docker-compose)
  # -----------------------------------------------------------------------
  integration-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Start LocalStack
        run: |
          docker compose -f docker-compose.localstack.yml up -d
          echo "Waiting for LocalStack to be ready..."
          for i in $(seq 1 30); do
            if curl -s http://localhost:4566/_localstack/health | grep -q '"s3": "available"'; then
              echo "LocalStack is ready!"
              break
            fi
            echo "Attempt $i/30 — waiting 2s..."
            sleep 2
          done

      - name: Run integration tests
        env:
          AWS_ENDPOINT_URL: http://localhost:4566
          AWS_ACCESS_KEY_ID: testing
          AWS_SECRET_ACCESS_KEY: testing
          AWS_DEFAULT_REGION: us-east-1
        run: |
          pytest -m integration --alluredir=allure-results-integration -v

      - name: Stop LocalStack
        if: always()
        run: docker compose -f docker-compose.localstack.yml down -v

      - name: Upload integration Allure results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-results-integration
          path: allure-results-integration/
          retention-days: 14

  # -----------------------------------------------------------------------
  # 3. BDD feature tests (moto — no Docker required)
  # -----------------------------------------------------------------------
  bdd-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run BDD feature tests
        run: |
          pytest tests/features/ --alluredir=allure-results-bdd -v

      - name: Upload BDD Allure results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-results-bdd
          path: allure-results-bdd/
          retention-days: 14

  # -----------------------------------------------------------------------
  # 4. S3 Validation — Real AWS (manual trigger or on-demand)
  #
  #    Credentials setup (choose one):
  #
  #    OPTION A — GitHub Secrets (quick start):
  #      Go to repo Settings > Secrets and variables > Actions > New secret
  #      Add these three secrets:
  #        AWS_ACCESS_KEY_ID
  #        AWS_SECRET_ACCESS_KEY
  #        AWS_SESSION_TOKEN
  #
  #    OPTION B — OIDC (recommended for production):
  #      Uncomment the OIDC step below and comment out the secrets step.
  #      Requires IAM OIDC provider setup in AWS (see terraform/main.tf).
  # -----------------------------------------------------------------------
  s3-validation:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install pytest-html

      # -- OPTION A: Use GitHub Secrets (default) --------------------------
      - name: Configure AWS credentials (Secrets)
        run: |
          echo "Using AWS credentials from GitHub Secrets"
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}

      # -- OPTION B: Use OIDC (uncomment below, comment out Option A) -----
      # - name: Configure AWS credentials (OIDC)
      #   uses: aws-actions/configure-aws-credentials@v4
      #   with:
      #     role-to-assume: arn:aws:iam::166083508693:role/github-actions-aws-testkit
      #     aws-region: ca-central-1

      - name: Run S3 connectivity tests
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
          AWS_DEFAULT_REGION: ca-central-1
          PYTHONPATH: src
        run: |
          python -m pytest tests/test_aws_connectivity.py -v \
            --html=reports/connectivity-report.html \
            --self-contained-html

      - name: Upload HTML test report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s3-validation-report
          path: reports/Test_Report_*.html
          retention-days: 30

      - name: Upload fallback report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s3-connectivity-report
          path: reports/connectivity-report.html
          retention-days: 30
