[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aws-testkit"
version = "1.0.0"
description = "Config-driven end-to-end BDD automation for AWS data pipelines"
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.34",
    "botocore>=1.34",
    "PyYAML>=6.0",
    "pytest>=7.4",
    "pytest-bdd>=7.0",
    "pytest-html>=4.0",
]

[project.optional-dependencies]
dev = [
    "allure-pytest>=2.13",
    "pytest-json-report>=1.5",
    "requests>=2.31",
    "ruff>=0.4",
]
# Only needed for DB-reconciliation use cases (SSH/SSM tunnel + MySQL)
db = [
    "mysql-connector-python>=8.0",
    "sshtunnel>=0.4",
]

[project.scripts]
aws-testkit = "aws_testkit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "bdd: BDD/Gherkin feature tests (live AWS)",
    "preflight: read-only AWS reachability checks",
]
bdd_features_base_dir = "tests/features/"
addopts = "-v --tb=short -m 'not preflight'"
log_cli = true
log_cli_level = "INFO"
log_cli_format = "%(asctime)s [%(levelname)s] %(name)s: %(message)s"
log_cli_date_format = "%Y-%m-%d %H:%M:%S"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]  # wrapped HTML strings in report.py

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]
"src/aws_testkit/cli.py" = ["B008"]  # argparse defaults
