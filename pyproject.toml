[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aws-testkit"
version = "0.1.0"
description = "Production-ready BDD test suite for AWS services"
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.34",
    "botocore>=1.34",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-bdd>=7.0",
    "moto[s3]>=5.0",
    "allure-pytest>=2.13",
    "pytest-json-report>=1.5",
    "requests>=2.31",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "unit: fast tests using moto mocks (no Docker required)",
    "integration: tests that run against LocalStack (requires Docker)",
    "bdd: BDD/Gherkin feature tests",
]
bdd_features_base_dir = "tests/features/"
addopts = "-v --tb=short"
log_cli = true
log_cli_level = "INFO"
log_cli_format = "%(asctime)s [%(levelname)s] %(name)s: %(message)s"
log_cli_date_format = "%Y-%m-%d %H:%M:%S"

[tool.ruff]
target-version = "py311"
line-length = 100
